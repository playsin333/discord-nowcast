# Builds discord-nowcast.exe and the Linux program and runs their checks on
# every push and pull request: a red cross on the commit when any fails. No release.
name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1

      - name: Tests
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/run.ps1

      # In the private working copy only: the exe of the latest main as the
      # pre-release "dev", one click to try it before a real release:
      # releases/download/dev/discord-nowcast.exe.
      - name: Test build
        if: github.repository == 'playsin333/discord-nowcast-dev' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev --cleanup-tag --yes || true
          gh release create dev discord-nowcast.exe --prerelease --target "$GITHUB_SHA" --title "Тестовая сборка" \
            --notes "Последний main dev-репозитория (${GITHUB_SHA::7}), не релиз."

  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: linux/go.mod
          cache-dependency-path: linux/go.sum

      - name: Format and vet
        run: |
          unformatted=$(gofmt -l .)
          [ -z "$unformatted" ] || { echo "gofmt: $unformatted"; exit 1; }
          go vet ./...

      # Under a session bus of its own: the tests put a player on it.
      - name: Tests
        run: |
          command -v dbus-run-session || { sudo apt-get update && sudo apt-get install -y dbus-daemon; }
          LANG=C.UTF-8 dbus-run-session -- go test -race -count=1 ./...

      - name: Build
        run: |
          CGO_ENABLED=0 GOARCH=amd64 go build -o /dev/null .
          CGO_ENABLED=0 GOARCH=arm64 go build -o /dev/null .
